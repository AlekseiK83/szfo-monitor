name: Ежедневный дайджест СЗФО

on:
  schedule:
    # GitHub запускает расписание с опозданием, особенно в начале часа:
    # прогон «на 9:00» фактически стартовал в 13–18 МСК. Поэтому — нестандартная
    # минута и два запуска. Второй ничего не делает, если первый уже всё обработал.
    - cron: '17 3 * * *'   # 06:17 МСК
    - cron: '43 9 * * *'   # 12:43 МСК — страховка
  workflow_dispatch:
    inputs:
      date:
        description: 'Дата YYYY-MM-DD (пусто = автодогон всех пропущенных дней)'
        required: false
        default: ''

permissions:
  contents: write

# Не даём ежедневному прогону, пересборке и backfill писать в репозиторий одновременно
concurrency:
  group: szfo-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка системных пакетов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y tesseract-ocr tesseract-ocr-rus poppler-utils

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Регрессионные тесты (при провале данные не публикуются)
        run: python -m unittest discover -s tests -v

      - name: Генерация дайджеста
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate.py --date "${{ github.event.inputs.date }}"
          else
            python generate.py
          fi

      - name: Коммит и push изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не создаётся"
          else
            git commit -m "Дайджест за $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash -q || true
            git push
          fi
