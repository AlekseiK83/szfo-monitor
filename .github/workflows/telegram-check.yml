name: Проверить получателей Telegram

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Разослать всем тестовое сообщение'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install -q requests

      - name: Проверка списка получателей
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.send_test }}" = "true" ]; then
            python notify_telegram.py --check --test
          else
            python notify_telegram.py --check
          fi
