name: Ежедневный дайджест СЗФО

on:
  schedule:
    # GitHub выполняет расписание «по возможности» и иногда пропускает запуски
    # без всякого предупреждения. Поэтому запуск — каждый час с 06:07 до 14:07 МСК.
    # Первый состоявшийся запуск обрабатывает вчерашний день, остальные за полминуты
    # видят, что всё уже сделано, и завершаются без OCR и без сообщений.
    - cron: '7 3-11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Дата YYYY-MM-DD (пусто = автодогон всех пропущенных дней)'
        required: false
        default: ''

permissions:
  contents: write

# Не даём ежедневному прогону, пересборке и backfill писать в репозиторий одновременно
concurrency:
  group: szfo-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Есть ли необработанные дни?
        id: need
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "Указана дата вручную — обрабатываем"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            python generate.py --needs-run
          fi

      - name: Установка системных пакетов
        if: steps.need.outputs.needed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y tesseract-ocr tesseract-ocr-rus poppler-utils

      - name: Регрессионные тесты (при провале данные не публикуются)
        if: steps.need.outputs.needed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Генерация дайджеста
        if: steps.need.outputs.needed == 'true'
        env:
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate.py --date "${{ github.event.inputs.date }}"
          else
            python generate.py
          fi

      - name: Коммит и push изменений
        if: steps.need.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не создаётся"
          else
            git commit -m "Дайджест за $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash -q || true
            git push
          fi

      - name: Уведомление в Telegram
        if: success() && steps.need.outputs.needed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE }}
        run: python notify_telegram.py

      - name: Уведомление о сбое в Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q requests || true
          python notify_telegram.py --failure || true
