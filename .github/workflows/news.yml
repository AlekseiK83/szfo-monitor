name: Значимые события СЗФО

on:
  schedule:
    # Каждые 3 часа (GitHub может сдвигать запуски — это не страшно,
    # ленты хранят историю за несколько дней, пропуск догоняется следующим прогоном)
    - cron: '37 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: szfo-data          # общая очередь с дайджестом указов — коммиты не пересекаются
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Регрессионные тесты детектора
        run: python -m unittest tests.test_news -v

      - name: Тесты региональной релевантности
        run: python -m unittest discover -s tests -p 'test_news_relevance.py' -v

      - name: Тесты ложных назначений и интервью чиновников
        run: python -m unittest tests.test_news_appointment_scope -v

      - name: Тесты значимого расширения персонала
        run: python -m unittest tests.test_news_staffing -v

      - name: Тесты публикации Росбалта и дедупликации
        run: python -m unittest tests.test_featured_staffing -v

      - name: Тесты процессуальных событий и шумовых новостей
        run: python -m unittest tests.test_news_proceedings_and_noise -v

      - name: Тесты диагностики и резервного получения Росбалта
        run: python -m unittest tests.test_news_diagnostics_rosbalt -v

      - name: Контроль качества от 24 ноября (шум, дубли, трассировка)
        run: python -m unittest tests.test_news_quality_20261124 -v

      - name: Проверка названия потока и неизменности маршрутов
        run: python -m unittest tests.test_news_branding_20261124 -v

      - name: Подключить Росбалт ко второму потоку
        run: python scripts/add_rosbalt_source.py

      - name: Сбор значимых событий СЗФО
        run: python news_monitor.py

      - name: Убедиться, что интервью врио министра не опубликовано
        run: python scripts/check_pln_interview.py

      - name: Проверить публикацию Росбалта от 23 ноября
        run: python scripts/check_featured_news.py

      - name: Коммит и push изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не создаётся"
          else
            git commit -m "Значимые события СЗФО, $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash -q || true
            git push
          fi

      - name: Уведомление в Telegram о новых событиях
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_monitor.py --notify

