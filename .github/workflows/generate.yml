name: Ежедневный дайджест СЗФО

on:
  schedule:
    # GitHub выполняет расписание «по возможности»: запуски откладываются на
    # часы, а часть выбрасывается (утренние у нас он выбрасывал почти всегда,
    # вечерние — выполнял). Поэтому попытка — каждый час круглые сутки.
    # Первая попытка после полуночи по Москве обрабатывает вчерашний день;
    # вечерняя попытка (после 19:00 МСК) ждёт 00:12 и обрабатывает день сразу;
    # остальные за полминуты видят, что всё сделано, и завершаются молча.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Дата YYYY-MM-DD (пусто = автодогон всех пропущенных дней)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Этап 1: есть ли что обрабатывать (и, вечером, ожидание полуночи) ──
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      needed: ${{ steps.need.outputs.needed == 'true' || steps.wait.outputs.needed == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Есть ли необработанные дни?
        id: need
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "Указана дата вручную — обрабатываем"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            python generate.py --needs-run
          fi

      - name: Вечерний запуск — дождаться полуночи по Москве
        id: wait
        if: steps.need.outputs.needed != 'true' && github.event_name == 'schedule'
        run: python generate.py --wait-midnight

  # ── Этап 2: обработка (в общей очереди с пересборкой и backfill) ──
  generate:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: szfo-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # свежий код и данные — после ожидания они могли измениться

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка системных пакетов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y tesseract-ocr tesseract-ocr-rus poppler-utils

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Регрессионные тесты (при провале данные не публикуются)
        run: python -m unittest discover -s tests -v

      - name: Генерация дайджеста
        env:
          SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate.py --date "${{ github.event.inputs.date }}"
          else
            python generate.py
          fi

      - name: Коммит и push изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не создаётся"
          else
            git commit -m "Дайджест за $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash -q || true
            git push
          fi

      - name: Уведомление в Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE }}
        run: python notify_telegram.py

      - name: Уведомление о сбое в Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q requests || true
          python notify_telegram.py --failure || true
