          git restore --source=HEAD --worktree -- .github/workflows/news.yml
          if ! git diff --quiet -- .github/workflows; then
            echo '::error::В workflow остались незапланированные изменения'
            exit 1
          fi

      - name: Новые регрессионные тесты
        run: python -m unittest tests.test_news_historical_appointment -v

      - name: Исходные регрессионные тесты
        run: python -m unittest tests.test_news -v

      - name: Защита существующих правил качества
        run: |
          python -m unittest tests.test_news_proceedings_and_noise -v
          python -m unittest tests.test_news_quality_20261124 -v
          python -m unittest tests.test_news_branding_20261124 -v

      - name: Удалить старые ложные карточки из events.json и пересобрать страницу
        run: python news_monitor.py --rebuild

      - name: Контроль удаления именно этой карточки
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f = Path('data/news/events.json')
          records = json.loads(f.read_text(encoding='utf-8')) if f.exists() else []
          bad = [e for e in records if 't.me/fontankaspb/114446' in e.get('link','')
                 and e.get('type') == 'appointment']
          if bad:
              raise SystemExit('Ошибка: ложная карточка Шмидта осталась в events.json')
          print(f'PASS: карточки Шмидта нет, сохранено событий: {len(records)}')
          PY

      - name: Сохранить исправления в main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news_monitor.py news.html data/news/events.json data/news/seen.json
          # Предварительная защита: не разрешаем коммитить workflow-файлы.
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo '::error::Обнаружено изменение .github/workflows в коммите'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Изменений нет — предыдущий запуск уже применил исправление'
          else
            git commit -m 'Значимые события: историческая справка не является назначением'
            git pull --rebase --autostash -q
            git push
          fi
