name: Ежедневный дайджест СЗФО

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Дата YYYY-MM-DD (пусто = автодогон всех пропущенных дней)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка системных пакетов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y tesseract-ocr tesseract-ocr-rus poppler-utils

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Регрессионные тесты (при провале данные не публикуются)
        run: python -m unittest discover -s tests -v

      - name: Генерация дайджеста
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python generate.py --date "${{ github.event.inputs.date }}"
          else
            python generate.py
          fi

      - name: Коммит и push изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не создаётся"
          else
            git commit -m "Дайджест за $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
