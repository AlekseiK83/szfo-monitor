name: Загрузить архив за период

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'От (YYYY-MM-DD)'
        required: true
      date_to:
        description: 'До (YYYY-MM-DD, включительно)'
        required: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка системных пакетов
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y tesseract-ocr tesseract-ocr-rus poppler-utils

      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Прогон по диапазону дат
        run: |
          from_date="${{ github.event.inputs.date_from }}"
          to_date="${{ github.event.inputs.date_to }}"
          current="$from_date"
          while [ "$current" != "$(date -I -d "$to_date + 1 day")" ]; do
            echo ""
            echo "═══════════════════════════════════════════════"
            echo "  $current"
            echo "═══════════════════════════════════════════════"
            python generate.py --date "$current" || echo "⚠ Пропущено: $current"
            current=$(date -I -d "$current + 1 day")
          done

      - name: Коммит и push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ index.html
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Backfill: ${{ github.event.inputs.date_from }} — ${{ github.event.inputs.date_to }}"
            git push
          fi
