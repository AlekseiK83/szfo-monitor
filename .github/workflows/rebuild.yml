name: Пересобрать без OCR (применить новые паттерны)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка Python-зависимостей (без tesseract — OCR не нужен)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Пересборка из reports/*.json
        run: python generate.py --rebuild

      - name: Коммит и push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Rebuild: переприменены паттерны регионов $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
